apiVersion: v1
kind: Namespace
metadata: {name: shop, labels: {istio-injection: enabled}}
---
apiVersion: v1
kind: Namespace
metadata: {name: legacy}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: shop}
spec: {selector: {app: web}, ports: [{name: http, port: 5678, targetPort: 5678}]}
---
apiVersion: v1
kind: Service
metadata: {name: pay, namespace: shop}
spec: {selector: {app: pay}, ports: [{name: http, port: 5678, targetPort: 5678}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web-v1, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: web, version: v1}}
  template:
    metadata: {labels: {app: web, version: v1}}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-text=v1", "-listen=:5678"]
          ports: [{containerPort: 5678}]
          resources: {requests: {cpu: 20m, memory: 24Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web-v2, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: web, version: v2}}
  template:
    metadata: {labels: {app: web, version: v2}}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-text=v2", "-listen=:5678"]
          ports: [{containerPort: 5678}]
          resources: {requests: {cpu: 20m, memory: 24Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pay-good, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: pay, version: v1, health: good}}
  template:
    metadata: {labels: {app: pay, version: v1, health: good}}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-text=ok", "-listen=:5678"]
          ports: [{containerPort: 5678}]
          resources: {requests: {cpu: 20m, memory: 24Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pay-bad, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: pay, version: v1, health: bad}}
  template:
    metadata: {labels: {app: pay, version: v1, health: bad}}
    spec:
      containers:
        - name: always-500
          image: python:3.12-alpine
          command: ["python", "-c"]
          args:
            - |
              import http.server as h
              class H(h.BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(500); self.end_headers(); self.wfile.write(b"boom")
                  def log_message(self, *a): pass
              h.HTTPServer(("", 5678), H).serve_forever()
          ports: [{containerPort: 5678}]
          resources: {requests: {cpu: 20m, memory: 24Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: client}}
  template:
    metadata: {labels: {app: client}}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["sleep", "infinity"]
          resources: {requests: {cpu: 20m, memory: 24Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: legacy-client, namespace: legacy}
spec:
  replicas: 1
  selector: {matchLabels: {app: legacy-client}}
  template:
    metadata: {labels: {app: legacy-client}}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["sleep", "infinity"]
          resources: {requests: {cpu: 20m, memory: 24Mi}}
